name: ETF Collector

on:
  workflow_dispatch:
  schedule:
    # UTC 기준 / 한국시간 평일 오전 10시
    - cron: "0 1 * * 1-5"

    # UTC 기준 / 한국시간 평일 정오 12시
    - cron: "0 3 * * 1-5"

concurrency:
  group: marketmind-etf-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run ETF collection on Buddy4 through the authenticated HTTPS job API
        env:
          BUDDY4_JOB_URL: ${{ secrets.BUDDY4_JOB_URL }}
          BUDDY4_JOB_TOKEN: ${{ secrets.BUDDY4_JOB_TOKEN }}
        run: |
          test -n "$BUDDY4_JOB_URL" && test -n "$BUDDY4_JOB_TOKEN"
          case "$BUDDY4_JOB_URL" in https://*) ;; *) echo "HTTPS endpoint required"; exit 1;; esac
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $BUDDY4_JOB_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' "$BUDDY4_JOB_URL"
