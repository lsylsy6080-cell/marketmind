name: ETF Collector

on:
  workflow_dispatch:
  schedule:
    # UTC 기준 / 한국시간 평일 오전 10시
    - cron: "0 1 * * 1-5"

    # UTC 기준 / 한국시간 평일 정오 12시
    - cron: "0 3 * * 1-5"

concurrency:
  group: marketmind-etf-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: market-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ETF collector
        run: npm run etf:collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          COINGLASS_API_KEY_HEADER: ${{ vars.COINGLASS_API_KEY_HEADER }}
          COINGLASS_BASE_URL: ${{ vars.COINGLASS_BASE_URL }}
          COINGLASS_ETF_PATH: ${{ vars.COINGLASS_ETF_PATH }}

          ETF_ASSET: BTC
          ETF_MARKET: US
          ETF_SOURCE: coinglass
          ETF_DRY_RUN: "false"